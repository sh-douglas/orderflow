[project]
name = "orderflow-api"
version = "0.1.0"
description = "Backend API for the OrderFlow platform, built with FastAPI."
authors = [
    {name = "SenhorDosSonhos1",email = "marcelosamu2002@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[tool.taskipy.tasks]
lint = "ruff check . && ruff format --check ."
format = "ruff check . --fix && ruff format ."
pre_test = "ruff check . && ruff format --check ."
test = "pytest -vv --cov=app --cov-report=term-missing --cov-report=html"
dev = "fastapi dev app/main.py"
run = "fastapi run app/main.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
